services:
  postgres:
    image: postgres:16

    container_name: Analisis

    restart: unless-stopped

    environment:
      POSTGRES_DB: postgres 
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1974

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d BD_FILE"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: